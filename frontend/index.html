<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Legendas - Teste IA</title>
    
    <style>
        /* ... (MANTENHA TODO O SEU CSS ORIGINAL AQUI) ... */
        :root {
            --bg-color: #0b0914;
            --card-bg: #151122;
            --purple-primary: #9333ea;
            --purple-hover: #a855f7;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(147, 51, 234, 0.15);
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(147, 51, 234, 0.3);
        }

        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; text-align: center; }
        h1 span { color: var(--purple-hover); }
        p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }
        .input-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted); }
        
        input[type="text"] {
            width: 100%; padding: 12px; background-color: #0b0914; border: 1px solid #3b2a5c;
            border-radius: 8px; color: var(--text-color); font-size: 1rem; box-sizing: border-box;
            outline: none; transition: border-color 0.3s;
        }
        input[type="text"]:focus { border-color: var(--purple-primary); }
        
        button {
            width: 100%; padding: 12px; background-color: var(--purple-primary); color: white;
            border: none; border-radius: 8px; font-size: 1rem; font-weight: bold;
            cursor: pointer; transition: background-color 0.3s;
        }
        button:hover { background-color: var(--purple-hover); }
        button:disabled { background-color: #4b3b6e; cursor: not-allowed; }
        
        .output-group { margin-top: 1.5rem; }
        textarea {
            width: 100%; height: 150px; padding: 12px; background-color: #0b0914;
            border: 1px solid #3b2a5c; border-radius: 8px; color: var(--text-color);
            font-size: 0.95rem; box-sizing: border-box; resize: vertical; outline: none;
        }
        #loading { text-align: center; color: var(--purple-hover); font-size: 0.9rem; margin-top: 1rem; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gerador de <span>Legendas</span></h1>
        <p class="subtitle">Cole o link do vídeo do Instagram ou Facebook</p>

        <div class="input-group">
            <label for="urlVideo">URL do Vídeo</label>
            <input type="text" id="urlVideo" placeholder="https://www.instagram.com/reel/...">
        </div>

        <!-- REMOVIDO o onclick="gerarLegenda()" daqui -->
        <button id="btnGerar">Gerar Legenda</button>

        <div id="loading">Processando vídeo e gerando IA (entrando na fila)... Aguarde.</div>

        <div class="output-group">
            <label for="resultado">Legenda Transcrita:</label>
            <textarea id="resultado" placeholder="A legenda aparecerá aqui..." readonly></textarea>
        </div>
    </div>

    <!-- USANDO TIPO MODULE PARA IMPORTAR O CLIENTE DO GRADIO -->
    <script>

document.getElementById('btnGerar').addEventListener('click', async () => {
    const urlInput = document.getElementById('urlVideo').value;
    const btn = document.getElementById('btnGerar');
    const loading = document.getElementById('loading');
    const textareaResultado = document.getElementById('resultado');

    if (!urlInput) {
        alert('Por favor, insira a URL de um vídeo.');
        return;
    }

    btn.disabled = true;
    loading.style.display = 'block';
    textareaResultado.value = '';

    try {
        const baseUrl = "https://phrasecraft-srt-generator-api.hf.space/gradio_api";

        // Passo 1: envia o job, recebe um EVENT_ID
        const postResp = await fetch(`${baseUrl}/call/predict`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ data: [urlInput] })
        });
        const postResult = await postResp.json();
        console.log("Resposta do POST:", JSON.stringify(postResult));
        const eventId = postResult.event_id;

        if (!eventId) {
            throw new Error("Não recebi event_id — resposta: " + JSON.stringify(postResult));
        }

        // Passo 2: escuta o resultado via SSE (GET)
        const getResp = await fetch(`${baseUrl}/call/predict/${eventId}`);
        const reader = getResp.body.getReader();
        const decoder = new TextDecoder();
        let finalData = null;

        let buffer = '';
        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            const lines = buffer.split('\n');
            for (const line of lines) {
                if (line.startsWith('data:')) {
                    const jsonStr = line.replace('data:', '').trim();
                    if (jsonStr) {
                        try {
                            finalData = JSON.parse(jsonStr);
                        } catch (e) {
                            console.warn("Linha não-JSON ignorada:", jsonStr);
                        }
                    }
                }
            }
        }

        console.log("Resultado final:", finalData);

        if (finalData && finalData[0] !== undefined) {
            textareaResultado.value = finalData[0];
        } else {
            throw new Error("Formato de resposta inesperado: " + JSON.stringify(finalData));
        }

    } catch (error) {
        console.error("Erro completo:", error);
        alert("Ocorreu um erro: " + error.message);
    } finally {
        btn.disabled = false;
        loading.style.display = 'none';
    }
});
    </script>
</body>
</html>
